{% extends 'base.html' %}

{% block title %}Referrals - MedLink EHR{% endblock %}

{% block page_title %}Referral Management{% endblock %}

{% block content %}
<style>
    /* ============================================================
       Government styling for referrals list
       ============================================================ */

    .quick-actions,
    .quick-actions *,
    .stats-grid,
    .stats-grid *,
    .card,
    .card *,
    .data-table,
    .data-table *,
    .form-control,
    .stat-card {
        font-family: 'Times New Roman', 'Source Serif 4', Georgia, serif !important;
    }

    .quick-actions {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .card {
        background: #ffffff;
        border: 1px solid #c9c5bc;
        border-top: 3px solid #1a2947;
        border-radius: 2px;
    }

    .card-header {
        border-bottom: 2px solid #1a2947;
        padding-bottom: 12px;
    }

    .card-title {
        color: #1a2947;
        font-weight: 700;
        letter-spacing: 0.01em;
    }

    .data-table thead tr {
        background: #f0ece4;
        border-bottom: 2px solid #1a2947;
    }

    .data-table th {
        color: #1a2947;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 0.82rem;
    }

    .data-table tbody tr:hover {
        background: #f7f5f0;
    }

    .stat-card {
        background: #ffffff;
        border: 1px solid #c9c5bc;
        border-top: 3px solid #1a2947;
        border-radius: 2px;
        padding: 22px 20px;
        text-align: center;
    }

    .stat-card:hover {
        border-top-color: #8b6f3d;
    }

    .stat-card .stat-info h3 {
        color: #1a2947;
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 6px;
    }

    .stat-card .stat-info p {
        color: #4a4a4a;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-size: 0.78rem;
        font-weight: 700;
    }

    .btn {
        border-radius: 2px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 0.8rem;
    }

    .btn-primary {
        background: #1a2947;
        border: 2px solid #1a2947;
        color: #ffffff;
    }

    .btn-primary:hover {
        background: #8b6f3d;
        border-color: #8b6f3d;
    }

    .btn-info {
        background: #1e3a5f;
        border: 2px solid #1e3a5f;
        color: #ffffff;
    }

    .btn-info:hover {
        background: #142a47;
        border-color: #142a47;
    }

    .btn-sm {
        padding: 4px 10px;
        font-size: 0.72rem;
    }

    .badge {
        border-radius: 2px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
        border: 1px solid;
    }

    .badge-danger {
        background: #f2e6e6;
        color: #7a2b2b;
        border-color: #7a2b2b;
    }

    .badge-warning {
        background: #fdf3e0;
        color: #8a5a1e;
        border-color: #8a5a1e;
    }

    .badge-success {
        background: #e6ede7;
        color: #2d5a3d;
        border-color: #2d5a3d;
    }

    .badge-info {
        background: #e6ecf2;
        color: #1e3a5f;
        border-color: #1e3a5f;
    }

    .form-control {
        border: 1px solid #c9c5bc;
        border-radius: 2px;
        background: #ffffff;
        font-family: 'Times New Roman', 'Source Serif 4', Georgia, serif !important;
    }

    .form-control:focus {
        outline: none;
        border-color: #1a2947;
        box-shadow: 0 0 0 3px rgba(26, 41, 71, 0.1);
    }
</style>

<div class="quick-actions">
    <button class="btn btn-primary" onclick="window.location.href='/referrals/create/'">
        <i class="fas fa-plus"></i> New Referral
    </button>
</div>

<div class="stats-grid" id="referralStats"></div>

<div class="card">
    <div class="card-header">
        <div class="card-title">Referrals</div>
        <div>
            <select id="statusFilter" class="form-control" style="width: 150px;">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <button class="btn btn-primary" onclick="loadReferrals()">Filter</button>
        </div>
    </div>
    
    <div style="overflow-x: auto;">
        <table class="data-table">
            <thead><tr><th>Referral #</th><th>Patient</th><th>To Facility</th><th>Reason</th><th>Priority</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="referralsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    async function loadStats() {
        try {
            const stats = await apiCall('/referrals/referrals/statistics/');
            document.getElementById('referralStats').innerHTML = `
                <div class="stat-card"><div class="stat-info"><h3>${stats.overall.total}</h3><p>Total</p></div></div>
                <div class="stat-card"><div class="stat-info"><h3>${stats.overall.pending}</h3><p>Pending</p></div></div>
                <div class="stat-card"><div class="stat-info"><h3>${stats.overall.completed}</h3><p>Completed</p></div></div>
                <div class="stat-card"><div class="stat-info"><h3>${stats.by_type.external}</h3><p>External</p></div></div>
            `;
        } catch (error) { console.error('Failed to load stats:', error); }
    }
    
    async function loadReferrals() {
        showLoading();
        try {
            const data = await apiCall(`/referrals/referrals/?status=${document.getElementById('statusFilter').value}`);
            renderReferrals(data.results);
        } catch (error) { showAlert('Failed to load referrals', 'danger'); }
        finally { hideLoading(); }
    }
    
    function renderReferrals(referrals) {
        const tbody = document.getElementById('referralsTableBody');
        if (referrals.length === 0) { tbody.innerHTML = '<tr><td colspan="8">No referrals found</td></tr>'; return; }
        
        tbody.innerHTML = referrals.map(ref => `
            <tr>
                <td>${ref.referral_number}</td>
                <td>${ref.patient_name}</td>
                <td>${ref.receiving_facility}</td>
                <td>${ref.reason_for_referral?.substring(0, 50)}</td>
                <td><span class="badge badge-${ref.priority === 'emergency' ? 'danger' : 'warning'}">${ref.priority_display}</span></td>
                <td><span class="badge badge-${ref.status === 'pending' ? 'warning' : (ref.status === 'completed' ? 'success' : 'info')}">${ref.status_display}</span></td>
                <td>${formatDate(ref.created_at)}</td>
                <td><button class="btn btn-sm btn-info" onclick="viewReferral(${ref.id})">View</button></td>
            </tr>
        `).join('');
    }
    
    function viewReferral(id) { window.location.href = `/referrals/detail/${id}/`; }
    
    loadStats();
    loadReferrals();
</script>
{% endblock %}
